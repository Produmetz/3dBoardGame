<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess & Go – Лобби</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        /* Tabs */
        .lobby-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #1e2a36;
            margin-bottom: 1.2rem;
            overflow: hidden;
        }

        .lobby-tab {
            padding: 0.6rem 1rem;
            background: none;
            border: none;
            color: #7a8eaa;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .lobby-tab:hover {
            color: #c9e9ff;
        }

        .lobby-tab.active {
            color: #4cc9f0;
            border-bottom-color: #4cc9f0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Quick Play */
        .quick-play-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            padding: 2rem 0;
        }

        .quick-play-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 500px;
            width: 100%;
        }

        .quick-play-btn {
            padding: 2rem 1rem;
            border: 2px solid #2a3a4a;
            border-radius: 12px;
            background: #0e1622;
            color: #c9e9ff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            text-align: center;
        }

        .quick-play-btn:hover {
            border-color: #4cc9f0;
            background: #162230;
            transform: translateY(-2px);
        }

        .quick-play-btn .qp-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .quick-play-status {
            color: #4cc9f0;
            font-size: 0.95rem;
            min-height: 1.5rem;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #4cc9f0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.4rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Create Room form */
        .create-form {
            max-width: 420px;
        }

        /* Join by Code */
        .join-code-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem 0;
        }

        .code-input-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .code-input {
            font-family: 'Courier New', monospace;
            font-size: 1.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-align: center;
            width: 200px;
            padding: 0.6rem 0.8rem;
            background: #0e1622;
            border: 2px solid #2a3a4a;
            border-radius: 8px;
            color: #c9e9ff;
            outline: none;
            transition: border-color 0.2s;
        }

        .code-input:focus {
            border-color: #4cc9f0;
        }

        .code-status {
            font-size: 0.9rem;
            min-height: 1.2rem;
            color: #9bb4d0;
        }

        .code-status.error {
            color: #f05454;
        }

        .code-status.success {
            color: #4caf50;
        }

        /* My Rooms cards */
        .my-rooms-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .my-room-card {
            background: #0e1622;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 0.9rem 1rem;
        }

        .my-room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .my-room-card-name {
            font-weight: 500;
            color: #c9e9ff;
        }

        .my-room-status {
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-weight: 500;
        }

        .status-waiting {
            background: rgba(255, 165, 0, 0.15);
            color: orange;
        }

        .status-playing {
            background: rgba(76, 201, 240, 0.15);
            color: #4cc9f0;
        }

        .my-room-card-details {
            font-size: 0.8rem;
            color: #9bb4d0;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 1rem;
        }

        .share-code {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }

        .share-code .room-code {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: #4cc9f0;
            background: #162230;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .share-code .copy-btn {
            background: none;
            border: 1px solid #2a3a4a;
            color: #9bb4d0;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .share-code .copy-btn:hover {
            color: #4cc9f0;
            border-color: #4cc9f0;
        }

        .my-room-card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* All Rooms tab */
        .all-rooms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .success-msg {
            background: rgba(76, 201, 240, 0.15);
            border: 1px solid rgba(76, 201, 240, 0.3);
            color: #4cc9f0;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
        }

        .success-msg .copy-btn {
            background: #2c4c6c;
            border: none;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 0.5rem;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .quick-play-grid {
                grid-template-columns: 1fr;
            }
            .lobby-tab {
                font-size: 0.8rem;
                padding: 0.5rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="server-name">Лобби</h1>
            <div class="header-actions">
                <button id="logout-btn" class="btn btn-secondary btn-sm">Выйти</button>
            </div>
        </div>

        <div class="panel">
            <!-- Tabs -->
            <div class="lobby-tabs" id="lobby-tabs">
                <button class="lobby-tab active" data-tab="quick-play">Быстрая игра</button>
                <button class="lobby-tab" data-tab="create-room">Создать комнату</button>
                <button class="lobby-tab" data-tab="join-code">Войти по коду</button>
                <button class="lobby-tab" data-tab="my-rooms">Мои комнаты</button>
                <button class="lobby-tab" data-tab="all-rooms">Все комнаты</button>
            </div>

            <!-- Quick Play -->
            <div class="tab-content active" id="tab-quick-play">
                <div class="quick-play-section">
                    <h2 style="margin-bottom:0.5rem;">Выберите игру</h2>
                    <div class="quick-play-grid">
                        <button class="quick-play-btn" id="qp-chess">
                            <span class="qp-icon">♟</span>
                            Шахматы
                        </button>
                        <button class="quick-play-btn" id="qp-go">
                            <span class="qp-icon">⚫</span>
                            Го
                        </button>
                    </div>
                    <div class="quick-play-status" id="quick-play-status"></div>
                </div>
            </div>

            <!-- Create Room -->
            <div class="tab-content" id="tab-create-room">
                <div class="create-form">
                    <h2 style="margin-bottom:1rem;">Создать комнату</h2>
                    <div class="input-group">
                        <label for="room-name">Название</label>
                        <input type="text" id="room-name" placeholder="Моя комната">
                    </div>
                    <div class="input-group">
                        <label for="room-password">Пароль (необязательно)</label>
                        <input type="password" id="room-password" placeholder="Оставьте пустым для открытой">
                    </div>
                    <div class="input-group">
                        <label for="room-game-type">Тип игры</label>
                        <select id="room-game-type">
                            <option value="chess">Шахматы</option>
                            <option value="go">Го</option>
                        </select>
                    </div>
                    <div id="go-options" style="display:none;">
                        <div class="input-group">
                            <label for="room-board-x">Размер X</label>
                            <input type="number" id="room-board-x" value="4" min="3" max="10">
                        </div>
                        <div class="input-group">
                            <label for="room-board-y">Размер Y</label>
                            <input type="number" id="room-board-y" value="4" min="3" max="10">
                        </div>
                        <div class="input-group">
                            <label for="room-board-z">Размер Z</label>
                            <input type="number" id="room-board-z" value="4" min="3" max="10">
                        </div>
                        <div class="input-group">
                            <label for="room-komi">Коми</label>
                            <input type="number" id="room-komi" value="6.5" step="0.5" min="0" max="100">
                        </div>
                    </div>
                    <div id="chess-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="room-allow-spectators" checked>
                            <label for="room-allow-spectators">Разрешить зрителей</label>
                        </div>
                        <div class="input-group">
                            <label for="room-creator-color">Ваш цвет</label>
                            <select id="room-creator-color">
                                <option value="white">Белые</option>
                                <option value="black">Чёрные</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="room-color-mode">Цвет второго игрока</label>
                            <select id="room-color-mode">
                                <option value="creator_pick">Создатель выбирает</option>
                                <option value="free_choice">Свободный выбор</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="room-game-mode">Режим игры</label>
                        <select id="room-game-mode">
                            <option value="rated">Рейтинговая</option>
                            <option value="unranked">Без рейтинга</option>
                            <option value="casual">Свободная</option>
                        </select>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="room-public" checked>
                        <label for="room-public">Публичная комната</label>
                    </div>
                    <button id="confirm-create" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Создать</button>
                    <div id="create-status" style="display:none; margin-top:0.8rem;"></div>
                </div>
            </div>

            <!-- Join by Code -->
            <div class="tab-content" id="tab-join-code">
                <div class="join-code-section">
                    <h2>Войти по коду</h2>
                    <p style="color:#9bb4d0; font-size:0.9rem;">Введите 6-значный код комнаты</p>
                    <div class="code-input-group">
                        <input type="text" id="code-input" class="code-input" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false">
                        <button id="code-join-btn" class="btn btn-primary">Войти</button>
                    </div>
                    <div class="code-status" id="code-status"></div>
                </div>
            </div>

            <!-- My Rooms -->
            <div class="tab-content" id="tab-my-rooms">
                <div class="all-rooms-header">
                    <h2>Мои комнаты</h2>
                    <button id="refresh-my-rooms" class="btn btn-secondary btn-sm">Обновить</button>
                </div>
                <div id="my-rooms-grid" class="my-rooms-grid">
                    <div class="no-rooms">Нет активных комнат</div>
                </div>
            </div>

            <!-- All Rooms -->
            <div class="tab-content" id="tab-all-rooms">
                <div class="all-rooms-header">
                    <h2>Доступные комнаты</h2>
                    <button id="refresh-btn" class="btn btn-secondary btn-sm">Обновить</button>
                </div>
                <div id="room-list" class="room-list">
                    <div class="no-rooms">Нет доступных комнат</div>
                </div>
            </div>
        </div>

        <!-- Right column: Profile + Leaderboard + History -->
        <div class="main-grid">
            <div class="left-column" style="display:none;"></div>
            <div class="right-column">
                <div class="panel">
                    <h2>Мой профиль</h2>
                    <div id="stats-nickname" style="color:#4cc9f0; margin-bottom:0.5rem;"></div>
                    <div id="stats-skill" style="font-size:0.85rem; color:#9bb4d0; margin-bottom:0.8rem;"></div>
                    <div style="margin-bottom:0.8rem;">
                        <label style="font-size:0.8rem; color:#7a8eaa;">
                            <input type="checkbox" id="public-rating-toggle" checked> Показать в рейтинге
                        </label>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-game">Шахматы</div>
                            <div class="stat-rating" id="chess-rating">—</div>
                            <div class="stat-record" id="chess-record">0 игр</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-game">Го</div>
                            <div class="stat-rating" id="go-rating">—</div>
                            <div class="stat-record" id="go-record">0 игр</div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Таблица лидеров</h2>
                    <div style="margin-bottom:0.8rem;">
                        <select id="leaderboard-game" style="padding:0.3rem; border-radius:5px; background:#1e2a36; color:#eef4ff; border:1px solid #2c3e4e;">
                            <option value="chess">Шахматы</option>
                            <option value="go">Го</option>
                        </select>
                    </div>
                    <div id="leaderboard-list" style="max-height:300px; overflow-y:auto;">
                        <div style="color:#7a8eaa; text-align:center;">Нет данных</div>
                    </div>
                </div>

                <div class="panel">
                    <h2>История игр</h2>
                    <div id="history-list" class="history-list">
                        <div class="no-rooms">Нет сохранённых игр</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Join Room Modal -->
    <div class="modal-overlay" id="join-modal">
        <div class="modal">
            <h3>Войти в комнату</h3>
            <p id="join-room-name" style="margin-bottom:1rem; color:#9bb4d0;"></p>
            <div class="input-group" id="join-password-group" style="display:none;">
                <label for="join-password">Пароль</label>
                <input type="password" id="join-password" placeholder="Введите пароль">
            </div>
            <div class="input-group">
                <label for="join-role">Роль</label>
                <select id="join-role">
                    <option value="player">Игрок</option>
                    <option value="spectator">Зритель</option>
                </select>
            </div>
            <div class="input-group" id="join-color-mode-group" style="display:none;">
                <label for="join-color-mode">Выбор цвета</label>
                <select id="join-color-mode">
                    <option value="auto">Автоматически</option>
                    <option value="pick">Выбрать цвет</option>
                </select>
            </div>
            <div class="input-group" id="join-color-select" style="display:none;">
                <label for="join-color">Ваш цвет</label>
                <select id="join-color">
                    <option value="white">Белые</option>
                    <option value="black">Чёрные</option>
                </select>
            </div>
            <div class="btn-group">
                <button id="confirm-join" class="btn btn-primary">Присоединиться</button>
                <button id="cancel-join" class="btn btn-secondary">Отмена</button>
            </div>
        </div>
    </div>

    <script src="lobby.js"></script>
    <script src="nav.js"></script>
    <script>Nav.init('lobby');</script>
</body>
</html>
