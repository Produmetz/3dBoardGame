<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess & Go – Replay</title>
    <link rel="stylesheet" href="lobby-styles.css">
    <style>
        body {
            overflow-y: auto;
        }
        .replay-board {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1;
            margin: 1rem auto;
            background: #0e1622;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .board-grid {
            display: grid;
            gap: 2px;
            padding: 1rem;
            width: 100%;
            height: 100%;
        }
        .board-cell {
            background: #1a2a3a;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #4a6a8a;
            position: relative;
        }
        .board-cell.has-stone {
            border-radius: 50%;
        }
        .board-cell.black-stone {
            background: #222;
            border: 2px solid #444;
        }
        .board-cell.white-stone {
            background: #eee;
            border: 2px solid #ccc;
        }
        .board-cell.chess-black {
            background: #333;
            border-radius: 4px;
            color: #fff;
            font-size: 1.2rem;
        }
        .board-cell.chess-white {
            background: #ddd;
            border-radius: 4px;
            color: #222;
            font-size: 1.2rem;
        }
        .board-cell.highlight-last {
            box-shadow: 0 0 0 2px #4cc9f0;
        }
        .replay-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
        }
        .replay-info {
            text-align: center;
            margin: 0.5rem 0;
            color: #9bb4d0;
        }
        .move-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 0.5rem;
            margin: 1rem 0;
        }
        .move-entry {
            padding: 0.3rem 0.5rem;
            font-size: 0.85rem;
            color: #9bb4d0;
            border-bottom: 1px solid #1a2a3a;
        }
        .move-entry.active {
            background: rgba(76, 201, 240, 0.15);
            color: #4cc9f0;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
            justify-content: center;
        }
        .speed-control label {
            font-size: 0.8rem;
            color: #9bb4d0;
        }
        .speed-control input[type="range"] {
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Просмотр игры</h1>
            <div class="header-actions">
                <a href="lobby.html" class="back-btn">← Лобби</a>
            </div>
        </div>

        <div class="main-grid" style="grid-template-columns: 1fr;">
            <div class="panel">
                <h2 id="replay-title">Загрузка...</h2>
                <div class="replay-info" id="replay-info"></div>

                <div class="replay-board" id="replay-board">
                    <div class="board-grid" id="board-grid"></div>
                </div>

                <div class="replay-controls">
                    <button class="btn btn-secondary btn-sm" id="btn-first">⏮</button>
                    <button class="btn btn-secondary btn-sm" id="btn-prev">◀</button>
                    <span id="move-counter" style="color:#9bb4d0; min-width:80px; text-align:center;">0 / 0</span>
                    <button class="btn btn-secondary btn-sm" id="btn-next">▶</button>
                    <button class="btn btn-secondary btn-sm" id="btn-last">⏭</button>
                    <button class="btn btn-primary btn-sm" id="btn-play">▶ Авто</button>
                </div>

                <div class="speed-control">
                    <label>Скорость:</label>
                    <input type="range" id="speed-slider" min="200" max="2000" value="800" step="100">
                    <span id="speed-value" style="color:#9bb4d0; font-size:0.8rem;">800мс</span>
                </div>

                <h3>Список ходов</h3>
                <div class="move-list" id="move-list"></div>
            </div>
        </div>
    </div>

    <script>
    class ReplayPlayer {
        constructor() {
            this.data = null;
            this.currentMove = -1;
            this.boardState = [];
            this.isPlaying = false;
            this.playInterval = null;
            this.speed = 800;
            this.boardDims = { x: 6, y: 6, z: 8 };

            this.loadData();
            this.setupControls();
        }

        loadData() {
            const params = new URLSearchParams(window.location.search);
            const dataStr = params.get('data');
            if (!dataStr) {
                document.getElementById('replay-title').textContent = 'Данные игры не найдены';
                return;
            }

            try {
                this.data = JSON.parse(decodeURIComponent(dataStr));
                this.initBoard();
                this.renderInfo();
                this.renderMoveList();
                this.renderBoard();
            } catch (e) {
                document.getElementById('replay-title').textContent = 'Ошибка загрузки данных';
            }
        }

        initBoard() {
            const bp = this.data.boardParams || {};
            if (this.data.gameType === 'chess') {
                this.boardDims = { x: 6, y: 6, z: 8 };
                this.boardState = [];
                for (let x = 0; x < this.boardDims.x; x++) {
                    this.boardState[x] = [];
                    for (let y = 0; y < this.boardDims.y; y++) {
                        this.boardState[x][y] = [];
                        for (let z = 0; z < this.boardDims.z; z++) {
                            this.boardState[x][y][z] = null;
                        }
                    }
                }
                this.setupChessInitial();
            } else {
                this.boardDims = {
                    x: bp.boardX || 4,
                    y: bp.boardY || 4,
                    z: bp.boardZ || 4
                };
                this.boardState = [];
                for (let i = 0; i < this.boardDims.x * this.boardDims.y * this.boardDims.z; i++) {
                    this.boardState[i] = 0;
                }
            }
        }

        setupChessInitial() {
            const pieces = {
                0: ['Rook','Knight','Bishop','Queen','King','Bishop'],
                1: ['Pawn','Pawn','Pawn','Pawn','Pawn','Pawn']
            };

            for (let x = 0; x < 6; x++) {
                this.boardState[x][0][0] = { color: 'White', piece: pieces[0][x] };
                this.boardState[x][1][0] = { color: 'White', piece: 'Pawn' };
                this.boardState[x][0][7] = { color: 'Black', piece: pieces[0][x] };
                this.boardState[x][1][7] = { color: 'Black', piece: 'Pawn' };
            }
        }

        setupControls() {
            document.getElementById('btn-first').addEventListener('click', () => this.goToStart());
            document.getElementById('btn-prev').addEventListener('click', () => this.prevMove());
            document.getElementById('btn-next').addEventListener('click', () => this.nextMove());
            document.getElementById('btn-last').addEventListener('click', () => this.goToEnd());
            document.getElementById('btn-play').addEventListener('click', () => this.toggleAutoPlay());

            document.getElementById('speed-slider').addEventListener('input', (e) => {
                this.speed = parseInt(e.target.value);
                document.getElementById('speed-value').textContent = this.speed + 'мс';
                if (this.isPlaying) {
                    this.stopAutoPlay();
                    this.startAutoPlay();
                }
            });
        }

        renderInfo() {
            document.getElementById('replay-title').textContent =
                `${this.data.gameType === 'chess' ? 'Шахматы' : 'Го'} — ${this.data.player1Name} vs ${this.data.player2Name}`;
            document.getElementById('replay-info').textContent =
                this.data.winnerName ? `Победитель: ${this.data.winnerName}` : 'Ничья';
        }

        renderMoveList() {
            const listDiv = document.getElementById('move-list');
            listDiv.innerHTML = '';
            this.data.moves.forEach((move, index) => {
                const div = document.createElement('div');
                div.className = 'move-entry';
                if (this.data.gameType === 'chess') {
                    const from = move.from;
                    const to = move.to;
                    div.textContent = `${index + 1}. (${from.x},${from.y},${from.z}) → (${to.x},${to.y},${to.z})`;
                } else {
                    const to = move.to;
                    div.textContent = `${index + 1}. (${to.x},${to.y},${to.z})`;
                }
                div.addEventListener('click', () => {
                    this.goToMove(index);
                });
                listDiv.appendChild(div);
            });
        }

        renderBoard() {
            const grid = document.getElementById('board-grid');
            if (this.data.gameType === 'chess') {
                this.renderChessBoard(grid);
            } else {
                this.renderGoBoard(grid);
            }
        }

        renderChessBoard(grid) {
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${this.boardDims.x}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${this.boardDims.z}, 1fr)`;

            for (let z = this.boardDims.z - 1; z >= 0; z--) {
                for (let x = 0; x < this.boardDims.x; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'board-cell';

                    const piece = this.boardState[x][0][z];
                    if (piece) {
                        const symbols = {
                            'King': piece.color === 'White' ? '♔' : '♚',
                            'Queen': piece.color === 'White' ? '♕' : '♛',
                            'Rook': piece.color === 'White' ? '♖' : '♜',
                            'Bishop': piece.color === 'White' ? '♗' : '♝',
                            'Knight': piece.color === 'White' ? '♘' : '♞',
                            'Pawn': piece.color === 'White' ? '♙' : '♟'
                        };
                        cell.textContent = symbols[piece.piece] || '?';
                        cell.classList.add(piece.color === 'White' ? 'chess-white' : 'chess-black');
                    } else {
                        cell.textContent = `${x},${z}`;
                    }
                    grid.appendChild(cell);
                }
            }
        }

        renderGoBoard(grid) {
            grid.innerHTML = '';
            const size = Math.max(this.boardDims.x, this.boardDims.y, this.boardDims.z);
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${size}, 1fr)`;

            for (let z = 0; z < this.boardDims.z; z++) {
                for (let y = 0; y < this.boardDims.y; y++) {
                    for (let x = 0; x < this.boardDims.x; x++) {
                        const idx = z * this.boardDims.x * this.boardDims.y + y * this.boardDims.x + x;
                        const cell = document.createElement('div');
                        cell.className = 'board-cell';

                        if (this.boardState[idx] === 1) {
                            cell.classList.add('has-stone', 'black-stone');
                            cell.textContent = '⚫';
                        } else if (this.boardState[idx] === 2) {
                            cell.classList.add('has-stone', 'white-stone');
                            cell.textContent = '⚪';
                        } else {
                            cell.textContent = `${x},${y},${z}`;
                        }
                        grid.appendChild(cell);
                    }
                }
            }
        }

        goToMove(index) {
            this.currentMove = index;
            this.resetBoard();

            for (let i = 0; i <= index; i++) {
                this.applyMove(this.data.moves[i], false);
            }

            this.renderBoard();
            this.updateMoveCounter();
            this.highlightCurrentMove();
        }

        resetBoard() {
            if (this.data.gameType === 'chess') {
                this.setupChessInitial();
            } else {
                for (let i = 0; i < this.boardState.length; i++) {
                    this.boardState[i] = 0;
                }
            }
        }

        applyMove(move, animate = false) {
            if (this.data.gameType === 'chess') {
                const from = move.from;
                const to = move.to;
                const piece = this.boardState[from.x][from.y][from.z];
                this.boardState[to.x][to.y][to.z] = piece;
                this.boardState[from.x][from.y][from.z] = null;
            } else {
                const to = move.to;
                const idx = to.z * this.boardDims.x * this.boardDims.y + to.y * this.boardDims.x + to.x;
                const currentPlayer = this.data.moves.indexOf(move);
                this.boardState[idx] = (currentPlayer % 2 === 0) ? 1 : 2;
            }
        }

        nextMove() {
            if (this.currentMove < this.data.moves.length - 1) {
                this.currentMove++;
                this.applyMove(this.data.moves[this.currentMove], true);
                this.renderBoard();
                this.updateMoveCounter();
                this.highlightCurrentMove();
            }
        }

        prevMove() {
            if (this.currentMove >= 0) {
                this.currentMove--;
                this.resetBoard();
                for (let i = 0; i <= this.currentMove; i++) {
                    this.applyMove(this.data.moves[i], false);
                }
                this.renderBoard();
                this.updateMoveCounter();
                this.highlightCurrentMove();
            }
        }

        goToStart() {
            this.currentMove = -1;
            this.resetBoard();
            this.renderBoard();
            this.updateMoveCounter();
            this.highlightCurrentMove();
        }

        goToEnd() {
            this.currentMove = this.data.moves.length - 1;
            this.resetBoard();
            for (let i = 0; i <= this.currentMove; i++) {
                this.applyMove(this.data.moves[i], false);
            }
            this.renderBoard();
            this.updateMoveCounter();
            this.highlightCurrentMove();
        }

        toggleAutoPlay() {
            if (this.isPlaying) {
                this.stopAutoPlay();
            } else {
                if (this.currentMove >= this.data.moves.length - 1) {
                    this.goToStart();
                }
                this.startAutoPlay();
            }
        }

        startAutoPlay() {
            this.isPlaying = true;
            document.getElementById('btn-play').textContent = '⏸ Пауза';
            this.playInterval = setInterval(() => {
                if (this.currentMove < this.data.moves.length - 1) {
                    this.nextMove();
                } else {
                    this.stopAutoPlay();
                }
            }, this.speed);
        }

        stopAutoPlay() {
            this.isPlaying = false;
            document.getElementById('btn-play').textContent = '▶ Авто';
            if (this.playInterval) {
                clearInterval(this.playInterval);
                this.playInterval = null;
            }
        }

        updateMoveCounter() {
            document.getElementById('move-counter').textContent =
                `${this.currentMove + 1} / ${this.data.moves.length}`;
        }

        highlightCurrentMove() {
            document.querySelectorAll('.move-entry').forEach((el, i) => {
                el.classList.toggle('active', i === this.currentMove);
            });

            const list = document.getElementById('move-list');
            const active = list.querySelector('.active');
            if (active) {
                active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.replay = new ReplayPlayer();
    });
    </script>
</body>
</html>
